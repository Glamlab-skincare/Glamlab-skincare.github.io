<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlamLab · ניסוי 1א</title>
<!--
  ניסוי 1א (21.10.2026): האם דף מאתר אחר מצליח לדבר עם השרת ב-Apps Script דרך doPost?
  ⚠️ אין כאן סודות: כתובת ה-Web App ציבורית ממילא. אין שמירה של שום דבר.
  ⚠️ כל טקסט שחוזר מהשרת מוצג כ-textContent (לא innerHTML) — אין הזרקה.
-->
<style>
  body{margin:0;padding:20px;font-family:Heebo,Arial,sans-serif;background:#FCEAF1;color:#2A1620}
  .card{max-width:34rem;margin:0 auto;background:#fff;border-radius:1.4rem;padding:1.2rem 1.3rem;box-shadow:0 14px 30px -16px rgba(60,10,32,.3)}
  h1{color:#8A1338;font-size:1.25rem;margin:0 0 .6rem}
  label{display:block;font-size:.85rem;margin:.6rem 0 .3rem}
  input{width:100%;box-sizing:border-box;padding:.6rem .8rem;border-radius:.9rem;border:1.5px solid rgba(138,19,56,.25);font-size:.85rem;direction:ltr}
  button{margin-top:.8rem;width:100%;padding:.8rem;border:0;border-radius:999px;background:linear-gradient(135deg,#8A1338,#5E0C27);color:#fff;font-weight:700;font-size:1rem}
  .row{margin-top:.7rem;padding:.6rem .8rem;border-radius:.9rem;font-size:.85rem;line-height:1.6;background:#F7E3EA}
  .ok{background:#E3EFE3;color:#2C6236}.bad{background:#FBE3E3;color:#8A1338}
  pre{white-space:pre-wrap;word-break:break-word;font-size:.72rem;direction:ltr;text-align:left;background:#faf6f8;padding:.6rem;border-radius:.6rem;max-height:14rem;overflow:auto}
</style>
</head>
<body>
<div class="card">
  <h1>ניסוי 1א · חיבור לשרת מאתר אחר</h1>
  <p style="font-size:.85rem;line-height:1.6;margin:0">מדביקים את כתובת ה-Web App (נגמרת ב-<bdi dir="ltr">/exec</bdi>) ולוחצים "בדיקה". שתי בקשות יוצאות לשרת: רשימת הרכיבים, ושאלת שילוב בהריון.</p>
  <label for="url">כתובת ה-Web App</label>
  <input id="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
  <button id="go" type="button">בדיקה</button>
  <div id="out"></div>
</div>
<script>
function row(cls, text){ const d=document.createElement('div'); d.className='row '+cls; d.textContent=text; document.getElementById('out').appendChild(d); return d; }
function dump(obj){ const p=document.createElement('pre'); p.textContent=JSON.stringify(obj,null,2).slice(0,3000); document.getElementById('out').appendChild(p); }
async function call(url, module, action, payload){
  // ⚠️ text/plain בכוונה — בלי בדיקת CORS מקדימה (ראו doPost ב-WebApp.gs)
  const res = await fetch(url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ module, action, payload, lang:'he' }) });
  return res.json();
}
document.getElementById('go').addEventListener('click', async () => {
  const url = document.getElementById('url').value.trim();
  document.getElementById('out').innerHTML = '';
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)) { row('bad','הכתובת צריכה להיראות כך: https://script.google.com/macros/s/…/exec'); return; }
  try {
    const r1 = await call(url, 'catalog', 'list', {});
    if (r1 && r1.ok) row('ok', '✓ 1/2 · השרת ענה: ' + r1.data.count + ' רכיבים בקטלוג');
    else { row('bad', '✗ 1/2 · השרת ענה בשגיאה'); dump(r1); return; }
    const r2 = await call(url, 'ask', 'pair', { a:'Retinol', b:'Niacinamide', gender:'f', health:{ pregnant:true } });
    const notes = (r2 && r2.ok && r2.data.health_notes) || [];
    if (notes.length) { row('ok', '✓ 2/2 · הערת ההריון הגיעה:'); row('', notes[0]); }
    else { row('bad', '✗ 2/2 · התשובה הגיעה בלי הערת הריון'); dump(r2); return; }
    row('ok', '🎉 הניסוי הצליח: דף מאתר אחר מדבר עם אותו שרת, דרך אותו חוזה.');
  } catch (e) {
    row('bad', '✗ הבקשה נחסמה או נכשלה: ' + (e && e.message || e));
    row('', 'אם כתוב "Failed to fetch" — כנראה CORS, או שעוד לא נעשה New version אחרי הוספת doPost.');
  }
});
</script>
</body>
</html>
